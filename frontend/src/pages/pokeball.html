<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Pokeball Catch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffcb05;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto;
    }

    .stage {
      position: relative;
      width: 360px;
      height: 360px;
      display: grid;
      place-items: center;
    }

    .hidden {
      opacity: 0;
    }

    .pokeball {
      width: 192px;
      height: 192px;
      background:
        radial-gradient(white 16px,
          black 17px 18px,
          white 19px 24px,
          black 25px 32px,
          transparent 33px),
        linear-gradient(to bottom, red 0 80px, black 81px 96px, white 97px 100%);
      border-radius: 50%;
      border: 8px solid black;
      box-shadow: inset -16px -8px 0 0 rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
      transform-origin: center;
      pointer-events: none;
      transition: background 1s ease-in-out, background-position 1s ease-in-out;
    }

    /* Transformed Pokeball after blink */
    .transformed {
      background:
        radial-gradient(white 16px,
          black 17px 18px,
          white 19px 24px,
          black 25px 32px,
          transparent 33px),
        linear-gradient(to bottom, red 0 79px, black 80px 91px, transparent 92px 100%),
        linear-gradient(to bottom, gray 0 89px, black 90px 101px, white 102px 100%);
      background-position:
        center -50px,
        center -50px,
        center 37px;
      background-repeat: no-repeat;
      background-size:
        100% 100%,
        100% 100%,
        100% 100%;
    }

    .untransformed {
      background:
        radial-gradient(white 16px,
          black 17px 18px,
          white 19px 24px,
          black 25px 32px,
          transparent 33px),
        linear-gradient(to bottom, red 0 79px, black 80px 91px, transparent 92px 100%),
        linear-gradient(to bottom, gray 0 79px, black 80px 91px, white 92px 100%);
      background-position:
        center 0px,
        center 0px,
        center 5px;
      background-repeat: no-repeat;
      background-size:
        100% 100%,
        100% 100%,
        100% 100%;
    }

    @keyframes fall {
      0% {
        transform: translateY(-200%);
        opacity: 1;
      }

      60% {
        transform: translateY(0);
      }

      80% {
        transform: translateY(-10%);
      }

      100% {
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0% {
        transform: translateX(0) rotate(0);
      }

      20% {
        transform: translateX(-10px) rotate(-20deg);
      }

      30% {
        transform: translateX(10px) rotate(20deg);
      }

      50% {
        transform: translateX(-10px) rotate(-10deg);
      }

      60% {
        transform: translateX(10px) rotate(10deg);
      }

      100% {
        transform: translateX(0) rotate(0);
      }
    }

    @keyframes blink {
      75% {
        filter: brightness(50%);
      }
    }

    .fall {
      animation: fall 0.5s ease-in-out forwards;
    }

    .shake {
      animation: shake 0.5s ease-in-out;
    }

    .blink {
      animation: blink 0.25s ease-in-out 3;
    }

    #pokemonBox {
      display: none;
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      padding: 15px;
      text-align: center;
      background: white;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      z-index: 3;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    #catchBtn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 25px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: #888;
      color: white;
      cursor: not-allowed;
      opacity: 0.7;
    }

    #catchBtn.active {
      background: #d62828;
      cursor: pointer;
      opacity: 1;
    }

    #backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 2;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="backdrop"></div>

  <div class="stage">
    <div class="pokeball hidden" id="ball"></div>
    <div id="pokemonBox">Pokemon</div>
  </div>

  <button id="catchBtn">Catch</button>

  <script>
    const ball = document.getElementById('ball');
    const btn = document.getElementById('catchBtn');
    const box = document.getElementById('pokemonBox');
    const backdrop = document.getElementById('backdrop');

    // Start disabled
    btn.disabled = true;
    let hasInitialFall = false;

    // Show pokeball with fall
    window.onload = () => {
      setTimeout(() => {
        ball.classList.remove('hidden');
        ball.classList.add('fall');
      }, 800);
    };

    // Activate button after fall
    ball.addEventListener('animationend', e => {
      if (e.animationName === 'fall') {
        hasInitialFall = true;
        btn.classList.add('active');
        btn.disabled = false;
        ball.style.pointerEvents = 'auto';
      }
    });

    // Function to trigger shake reliably
    function triggerShake() {
      ball.classList.remove('shake');
      void ball.offsetWidth; // force reflow
      ball.classList.add('shake');
    }

    // Click → 3 shakes → blink → transform → show Pokémon
    btn.addEventListener('click', () => {
      btn.disabled = true;
      let shakes = 0;

      function doShake() {
        triggerShake();
        setTimeout(() => {
          shakes++;
          if (shakes < 3) {
            doShake();
          } else {
            // After all shakes, start blink
            ball.classList.add('blink');
          }
        }, 800); // shake duration
      }

      doShake();
    });

    // Listen for blink finishing 
    ball.addEventListener('animationend', e => {
      if (e.animationName === 'blink') {
        // Smoothly transform Pokeball
        ball.classList.add('transformed');

        // Show Pokémon after transition
        setTimeout(() => {
          box.style.display = 'block';
          backdrop.style.display = 'block';
        }, 1000); // match transition duration
      }
    });

    // Click outside to reset
    backdrop.addEventListener('click', () => {
      // Hide box and backdrop
      box.style.display = 'none';
      backdrop.style.display = 'none';

      // Remove transformed class and revert to original pokeball
      ball.classList.remove('transformed');
      ball.classList.add('untransformed');

      // After transition completes, clean up and re-enable
      setTimeout(() => {
        ball.classList.remove('untransformed');
        // Ensure pokeball is back to normal state
        ball.classList.remove('blink', 'shake', 'fall');
        btn.classList.add('active');
        btn.disabled = false;
        console.log('Reset complete - ready for next catch');
      }, 1000); // match transition duration
    });
  </script>

</body>

</html>
